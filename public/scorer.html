<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zadávání skóre</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2f7a3d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Tenis live" />
<link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
<div class="conn-badge" id="connBadge">připojování…</div>
<div class="wrap">
  <header class="top">
    <h1>🎾 Zadávání skóre</h1>
    <p>Klepnutím na tlačítko přidáte bod hráči.</p>
    <p class="match-code-line" id="matchCodeLine"></p>
  </header>

  <div class="card">
    <div class="sets-row" id="setsRow"></div>

    <div class="scoreboard">
      <div class="player">
        <div class="name" id="nameA">Hráč A<span class="serve-dot" id="serveDotA" style="display:none"></span></div>
      </div>
      <div class="vs">vs</div>
      <div class="player">
        <div class="name" id="nameB"><span class="serve-dot" id="serveDotB" style="display:none"></span>Hráč B</div>
      </div>
    </div>

    <div class="serve-row">
      <span id="serveLabel">Podává: …</span>
      <button class="btn-secondary" id="btnSwapServer">🔄 Vyměnit podání</button>
    </div>

    <div class="scoreboard">
      <div class="player"><div class="point-value" id="pointA">0</div></div>
      <div class="vs" id="gameLabel">GAME</div>
      <div class="player"><div class="point-value" id="pointB">0</div></div>
    </div>

    <div class="status-line" id="statusLine"></div>
    <div class="winner-banner" id="winnerBanner" style="display:none"></div>

    <div class="controls" id="pointButtons">
      <button class="btn-point" id="btnA">Bod pro A</button>
      <button class="btn-point" id="btnB">Bod pro B</button>
    </div>

    <div class="reason-panel" id="reasonPanel" style="display:none">
      <div class="reason-title" id="reasonTitle">Bod pro …</div>

      <div class="serve-number-row">
        <span>Servis:</span>
        <button class="btn-serve-num active" data-serve="1" id="serveNum1">1.</button>
        <button class="btn-serve-num" data-serve="2" id="serveNum2">2.</button>
      </div>

      <div class="reason-grid">
        <button class="btn-reason" data-reason="winner">Winner</button>
        <button class="btn-reason" data-reason="ace" id="reasonAce">Eso</button>
        <button class="btn-reason" data-reason="service_winner" id="reasonServiceWinner">Přímý bod z podání</button>
        <button class="btn-reason" data-reason="forced_error">Vynucená chyba</button>
        <button class="btn-reason" data-reason="unforced_error">Nevynucená chyba</button>
        <button class="btn-reason" data-reason="double_fault" id="reasonDF">Dvojchyba soupeře</button>
        <button class="btn-reason btn-reason-muted" data-reason="">Bez upřesnění</button>
      </div>
      <button class="btn-secondary" id="reasonCancel">Zrušit</button>
    </div>

    <div class="row-secondary">
      <button class="btn-secondary" id="btnUndo">↩ Zpět</button>
      <button class="btn-secondary btn-danger" id="btnReset">Reset zápasu</button>
    </div>

    <div class="settings">
      <div class="settings-row">
        <div>
          <label>Jméno hráče A</label>
          <input type="text" id="inputNameA" maxlength="40" placeholder="Hráč A" />
        </div>
        <div>
          <label>Jméno hráče B</label>
          <input type="text" id="inputNameB" maxlength="40" placeholder="Hráč B" />
        </div>
      </div>
      <label>Formát zápasu</label>
      <select id="selectFormat">
        <option value="2">Na 2 vítězné sety (best of 3)</option>
        <option value="3">Na 3 vítězné sety (best of 5)</option>
      </select>

      <label class="checkbox-label">
        <input type="checkbox" id="checkboxSuperTB" />
        Rozhodující sada jako supertiebreak do 10 (místo poslední plné sady)
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="checkboxSound" checked />
        Zvuk a vibrace při zadání bodu
      </label>
    </div>
  </div>

  <div class="link-row"><a href="stats.html" data-match-link="stats.html">Zobrazit statistiky zápasu →</a></div>
  <div class="link-row"><a href="viewer.html" data-match-link="viewer.html">Otevřít pohled diváka →</a></div>
  <div class="link-row"><a href="index.html">← zpět na úvod</a></div>
</div>

<script src="match-id.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
applyMatchLinks();
const matchId = getMatchId();
document.getElementById('matchCodeLine').textContent = matchId
  ? `Kód zápasu: ${matchId}`
  : 'Výchozí sdílený zápas (bez kódu)';

const socket = io({ query: { matchId: matchId || '' } });
const badge = document.getElementById('connBadge');
let lastState = null;
let pendingPlayer = null;

let audioCtx = null;
function playPointFeedback() {
  if (!document.getElementById('checkboxSound').checked) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } catch (e) { /* Web Audio nemusí být dostupné, ignorujeme */ }
  if (navigator.vibrate) navigator.vibrate(30);
}

socket.on('connect', () => { badge.textContent = 'živě'; badge.classList.remove('offline'); });
socket.on('disconnect', () => { badge.textContent = 'odpojeno'; badge.classList.add('offline'); });

function render(payload) {
  const { state, display } = payload;
  lastState = state;

  document.getElementById('nameA').childNodes[0].textContent = state.playerA + ' ';
  document.getElementById('nameB').lastChild.textContent = ' ' + state.playerB;
  document.getElementById('btnA').textContent = `Bod pro ${state.playerA}`;
  document.getElementById('btnB').textContent = `Bod pro ${state.playerB}`;

  document.getElementById('serveDotA').style.display = state.server === 'A' && !state.matchWinner ? 'inline-block' : 'none';
  document.getElementById('serveDotB').style.display = state.server === 'B' && !state.matchWinner ? 'inline-block' : 'none';
  document.getElementById('serveLabel').textContent = state.matchWinner
    ? 'Podání: zápas skončil'
    : `Podává: ${state.server === 'A' ? state.playerA : state.playerB}`;

  if (document.activeElement.id !== 'inputNameA') document.getElementById('inputNameA').placeholder = state.playerA;
  if (document.activeElement.id !== 'inputNameB') document.getElementById('inputNameB').placeholder = state.playerB;
  document.getElementById('selectFormat').value = String(state.setsToWin);
  if (document.activeElement.id !== 'checkboxSuperTB') {
    document.getElementById('checkboxSuperTB').checked = !!state.deciderSuperTiebreak;
  }

  const setsRow = document.getElementById('setsRow');
  setsRow.innerHTML = '';
  state.sets.forEach((s, i) => {
    const pill = document.createElement('div');
    pill.className = 'set-pill';
    pill.textContent = s.superTiebreak ? `Super TB: ${s.a}-${s.b}` : `Set ${i + 1}: ${s.a}-${s.b}`;
    setsRow.appendChild(pill);
  });
  if (!state.matchWinner) {
    const pill = document.createElement('div');
    pill.className = 'set-pill';
    pill.textContent = state.isSuperTiebreakSet
      ? 'Rozhodující supertiebreak'
      : `Hry: ${state.currentSet.gamesA}-${state.currentSet.gamesB}`;
    setsRow.appendChild(pill);
  }

  const pointA = document.getElementById('pointA');
  const pointB = document.getElementById('pointB');
  const gameLabel = document.getElementById('gameLabel');
  const statusLine = document.getElementById('statusLine');
  const winnerBanner = document.getElementById('winnerBanner');
  const btnA = document.getElementById('btnA');
  const btnB = document.getElementById('btnB');

  if (state.matchWinner) {
    pointA.textContent = '-';
    pointB.textContent = '-';
    gameLabel.textContent = 'KONEC';
    statusLine.textContent = '';
    const winnerName = state.matchWinner === 'A' ? state.playerA : state.playerB;
    winnerBanner.style.display = 'block';
    winnerBanner.textContent = `🏆 Vítěz zápasu: ${winnerName}`;
    btnA.disabled = true;
    btnB.disabled = true;
    document.getElementById('btnSwapServer').disabled = true;
    closeReasonPanel();
    return;
  }
  winnerBanner.style.display = 'none';
  btnA.disabled = false;
  btnB.disabled = false;
  document.getElementById('btnSwapServer').disabled = false;

  if (display.type === 'superTiebreak') {
    gameLabel.textContent = 'SUPER TIEBREAK';
    pointA.textContent = display.a;
    pointB.textContent = display.b;
    statusLine.textContent = 'Rozhodující supertiebreak do 10';
  } else if (display.type === 'tiebreak') {
    gameLabel.textContent = 'TIEBREAK';
    pointA.textContent = display.a;
    pointB.textContent = display.b;
    statusLine.textContent = '';
  } else if (display.type === 'deuce') {
    gameLabel.textContent = 'GAME';
    pointA.textContent = '40';
    pointB.textContent = '40';
    statusLine.textContent = 'Shoda (deuce)';
  } else if (display.type === 'advantage') {
    gameLabel.textContent = 'GAME';
    pointA.textContent = display.side === 'A' ? 'Ad' : '40';
    pointB.textContent = display.side === 'B' ? 'Ad' : '40';
    statusLine.textContent = `Výhoda pro ${display.side === 'A' ? state.playerA : state.playerB}`;
  } else {
    gameLabel.textContent = 'GAME';
    pointA.textContent = display.a;
    pointB.textContent = display.b;
    statusLine.textContent = '';
  }
}

socket.on('state', render);

const pointButtons = document.getElementById('pointButtons');
const reasonPanel = document.getElementById('reasonPanel');
const reasonTitle = document.getElementById('reasonTitle');
let selectedServeNumber = 1;

function setServeNumber(n) {
  selectedServeNumber = n;
  document.getElementById('serveNum1').classList.toggle('active', n === 1);
  document.getElementById('serveNum2').classList.toggle('active', n === 2);
}

function openReasonPanel(player) {
  if (!lastState || lastState.matchWinner) return;
  pendingPlayer = player;
  const name = player === 'A' ? lastState.playerA : lastState.playerB;
  reasonTitle.textContent = `Bod pro ${name} — jak byl vyhrán?`;
  setServeNumber(1); // každý nový bod se začíná odhadem "1. servis"

  // Eso a přímý bod z podání dávají smysl jen když tento hráč podává;
  // dvojchyba jen když podává soupeř.
  const isServer = lastState.server === player;
  document.getElementById('reasonAce').style.display = isServer ? 'block' : 'none';
  document.getElementById('reasonServiceWinner').style.display = isServer ? 'block' : 'none';
  document.getElementById('reasonDF').style.display = isServer ? 'none' : 'block';

  pointButtons.style.display = 'none';
  reasonPanel.style.display = 'block';
}

function closeReasonPanel() {
  pendingPlayer = null;
  reasonPanel.style.display = 'none';
  pointButtons.style.display = 'grid';
}

document.getElementById('btnA').addEventListener('click', () => openReasonPanel('A'));
document.getElementById('btnB').addEventListener('click', () => openReasonPanel('B'));
document.getElementById('reasonCancel').addEventListener('click', closeReasonPanel);

document.getElementById('serveNum1').addEventListener('click', () => setServeNumber(1));
document.getElementById('serveNum2').addEventListener('click', () => setServeNumber(2));

document.querySelectorAll('.btn-reason').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (!pendingPlayer) return;
    const reason = btn.getAttribute('data-reason') || undefined;
    socket.emit('action', { type: 'point', player: pendingPlayer, reason, serveNumber: selectedServeNumber });
    playPointFeedback();
    closeReasonPanel();
  });
});

document.getElementById('btnSwapServer').addEventListener('click', () => {
  if (!lastState) return;
  const nextServer = lastState.server === 'A' ? 'B' : 'A';
  socket.emit('action', { type: 'setServer', player: nextServer });
});

document.getElementById('btnUndo').addEventListener('click', () => {
  closeReasonPanel();
  socket.emit('action', { type: 'undo' });
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('Opravdu vynulovat celý zápas?')) {
    closeReasonPanel();
    socket.emit('action', { type: 'reset' });
  }
});

let nameTimer = null;
function sendNames() {
  clearTimeout(nameTimer);
  nameTimer = setTimeout(() => {
    const a = document.getElementById('inputNameA').value.trim();
    const b = document.getElementById('inputNameB').value.trim();
    if (a || b) socket.emit('action', { type: 'setNames', playerA: a, playerB: b });
  }, 500);
}
document.getElementById('inputNameA').addEventListener('input', sendNames);
document.getElementById('inputNameB').addEventListener('input', sendNames);

function sendFormat() {
  const setsToWin = Number(document.getElementById('selectFormat').value);
  const deciderSuperTiebreak = document.getElementById('checkboxSuperTB').checked;
  socket.emit('action', { type: 'setFormat', setsToWin, deciderSuperTiebreak });
}
document.getElementById('selectFormat').addEventListener('change', sendFormat);
document.getElementById('checkboxSuperTB').addEventListener('change', sendFormat);
</script>
</body>
</html>
